<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="public/vars.css" />
    <link rel="stylesheet" type="text/css" href="public/global.css" />
    <style>
      /* ── Footer ── */
      #footer {
        flex-shrink: 0;
        padding: 8px;
        display: flex;
        align-items: center;
      }
      #footer-left {
        display: flex;
        align-items: center;
        gap: 4px;
        flex: 1;
      }
      #footer-right {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .footer-btn {
        background: var(--button-bg);
        border: 1px solid var(--button-border);
        cursor: pointer;
        padding: 6px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      }
      .footer-btn:hover { filter: brightness(0.95); }
      #new-doc-btn, #new-sheet-btn, #new-slide-btn { position: relative; }
      .new-badge {
        position: absolute;
        bottom: -2px;
        right: -2px;
        font-size: 9px;
        font-weight: bold;
        color: white;
        background: #1a73e8;
        border-radius: 50%;
        width: 11px;
        height: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .footer-btn img {
        width: 14px;
        height: 14px;
        -moz-context-properties: fill;
        fill: var(--text-color-secondary);
      }
      @keyframes spin {
        from { transform: rotateZ(0deg); }
        to { transform: rotateZ(360deg); }
      }
      .spinning { animation: spin 0.8s linear infinite; }
      #settings-popup {
        position: absolute;
        bottom: calc(100% + 4px);
        right: 0;
        background: var(--card-background);
        border: 1px solid var(--card-border);
        border-radius: var(--border-radius);
        padding: 4px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        white-space: nowrap;
      }
      .popup-view-btns {
        display: flex;
        gap: 4px;
        padding: 4px;
      }
      .popup-view-btn {
        flex: 1;
        background: var(--button-bg);
        color: var(--button-text);
        border: 1px solid var(--button-border);
        border-radius: calc(var(--border-radius) - 2px);
        padding: 4px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .popup-view-btn.active {
        background: var(--accent-color);
        color: var(--accent-text);
        border-color: var(--accent-color);
      }
      .popup-divider {
        border: none;
        border-top: 1px solid var(--card-border);
        margin: 4px 0;
      }
      .popup-toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
      }
      .popup-toggle-row:hover { background: var(--event-separator-color); border-radius: calc(var(--border-radius) - 2px); }

      /* ── Hero card ── */
      .hero-card {
        margin: 12px;
        padding: 16px;
        border-radius: var(--border-radius);
        border: 1px solid var(--card-border);
        background: var(--card-background);
      }
      .status-badge {
        display: block;
        width: fit-content;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 2px 8px;
        border-radius: 100px;
        margin-bottom: 10px;
      }
      .status-now .status-badge {
        background: var(--now-color);
        color: var(--now-text);
      }
      .status-soon .status-badge {
        background: var(--accent-color);
        color: var(--accent-text);
      }
      .status-later .status-badge {
        background: var(--event-separator-color);
        color: var(--text-color-secondary);
      }
      .hero-title {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 4px 0;
        line-height: 1.3;
        cursor: pointer;
      }
      .hero-title:hover {
        text-decoration: underline;
        text-decoration-color: var(--text-color-secondary);
      }
      .hero-time {
        font-size: 12px;
        color: var(--text-color-secondary);
        margin-bottom: 14px;
      }
      .join-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--accent-color);
        color: var(--accent-text);
        border: none;
        border-radius: var(--border-radius);
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        margin-bottom: 10px;
        width: fit-content;
      }
      .join-btn:hover { filter: brightness(0.92); }
      .join-btn-icon {
        width: 16px;
        height: 16px;
      }
      .hero-links {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }
      /* Description */
      .hero-description-toggle {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-top: 10px;
        padding: 4px 8px;
        margin-left: -8px;
        border-top: none;
        border-radius: var(--border-radius);
        cursor: pointer;
        user-select: none;
      }
      .hero-description-toggle:hover .hero-section-label,
      .hero-description-toggle:hover .hero-description-arrow {
        opacity: 1;
        color: var(--text-color);
      }
      .hero-description-divider {
        border: none;
        border-top: 1px solid var(--event-separator-color);
        margin: 10px 0 0;
      }
      .hero-description-arrow {
        width: 12px;
        height: 12px;
        opacity: 0.6;
        transition: transform 0.15s ease;
      }
      .hero-description-arrow.expanded {
        transform: rotate(180deg);
      }
      .hero-description {
        font-size: 12px;
        line-height: 1.5;
        color: var(--text-color);
        margin-top: 6px;
        overflow-wrap: break-word;
        word-break: break-word;
      }
      .hero-description a {
        color: LinkText;
      }
      .hero-description a:hover { text-decoration: underline; }
      /* Normalize Google's inline font sizes */
      .hero-description * { font-size: 12px !important; }
      .hero-description p,
      .hero-description div { margin: 0 0 4px; }

      /* Documents */
      .hero-docs {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--event-separator-color);
      }
      .hero-section-label {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-color-secondary);
        margin-bottom: 4px;
      }
      .hero-link-chip {
        display: block;
        font-size: 12px;
        color: LinkText;
        text-decoration: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 1px 0;
      }
      .hero-link-chip:hover { text-decoration: underline; }

      /* ── Later today section ── */
      .later-section {
        margin: 0 12px 12px;
      }
      .later-section-tomorrow {
        margin-top: 24px;
      }
      .section-label {
        display: block;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-color-secondary);
        padding: 4px 0 8px;
        text-decoration: none;
      }
      .compact-event {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 4px;
        border-top: 1px solid var(--event-separator-color);
        border-radius: calc(var(--border-radius) - 2px);
      }
      .compact-event:hover {
        background: var(--event-separator-color);
      }
      .compact-time {
        font-size: 11px;
        color: var(--text-color-secondary);
        white-space: nowrap;
        width: 54px;
        flex-shrink: 0;
      }
      .compact-title {
        font-size: 13px;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .compact-join {
        flex-shrink: 0;
        opacity: 0.5;
        display: flex;
        align-items: center;
        text-decoration: none;
      }
      .compact-join:hover { opacity: 1; }
      .compact-join-icon {
        width: 14px;
        height: 14px;
      }

      #calendar-view {
        animation: fadeIn 0.15s ease;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      /* ── Empty / done state ── */
      .empty-state {
        padding: 48px 24px;
        text-align: center;
        color: var(--text-color-secondary);
      }
      .empty-state .empty-icon {
        font-size: 32px;
        margin-bottom: 12px;
      }
      .empty-state .empty-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-color);
        margin-bottom: 4px;
      }
      .empty-state .empty-subtitle {
        font-size: 12px;
      }

      /* ── Recent docs ── */
      #recent-docs-view {
        flex-shrink: 0;
        background: color-mix(in srgb, Canvas 100%, CanvasText 4%);
        border-top: 1px solid var(--card-border);
        padding: 4px 0;
      }
      .doc-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 4px;
        border-top: 1px solid var(--event-separator-color);
        text-decoration: none;
        color: var(--text-color);
        border-radius: calc(var(--border-radius) - 2px);
      }
      .doc-row:hover { background: var(--event-separator-color); }
      .doc-icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .doc-info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .doc-name {
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .doc-context {
        font-size: 11px;
        color: var(--text-color-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

/* ── Login view ── */
      #login-view {
        padding: 12px;
        flex: 1;
      }

      #calendar-view {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
      }
      .connect-card {
        border: 1px solid var(--card-border);
        border-radius: var(--border-radius);
        padding: 14px;
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--card-background);
      }
      .connect-icon { width: 24px; height: 24px; flex-shrink: 0; }
      .connect-content { flex-grow: 1; }
      .connect-name {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 2px 0;
      }
      .connect-description {
        font-size: 11px;
        color: var(--text-color-secondary);
        margin: 0;
      }
      #connect-btn {
        background: var(--accent-color);
        color: var(--accent-text);
        border: none;
        border-radius: var(--border-radius);
        padding: 6px 14px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        flex-shrink: 0;
      }
      #connect-btn:hover { filter: brightness(0.92); }
    </style>
  </head>
  <body>
    <!-- Login view -->
    <div id="login-view" style="display:none">
      <div class="connect-card">
        <img class="connect-icon" src="public/googleAccount.png" />
        <div class="connect-content">
          <h2 class="connect-name" id="service-name"></h2>
          <p class="connect-description" id="service-description"></p>
        </div>
        <button id="connect-btn"></button>
      </div>
    </div>

    <!-- Calendar view -->
    <div id="calendar-view" style="display:none"></div>

    <!-- Recent docs -->
    <div id="recent-docs-view"></div>

    <!-- Footer (shown when connected) -->
    <div id="footer" style="display:none">
      <div id="footer-left">
        <a id="gmail-btn" class="footer-btn" title="Gmail" href="https://mail.google.com/" target="_blank">
          <img src="https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico" alt="Gmail" />
        </a>
        <a id="new-doc-btn" class="footer-btn" title="New Doc" href="https://docs.new/" target="_blank">
          <img src="https://ssl.gstatic.com/docs/documents/images/kix-favicon-2023q4.ico" alt="New Doc" />
          <span class="new-badge">+</span>
        </a>
        <a id="new-sheet-btn" class="footer-btn" title="New Sheet" href="https://sheets.new/" target="_blank">
          <img src="https://ssl.gstatic.com/docs/spreadsheets/spreadsheets_2023q4.ico" alt="New Sheet" />
          <span class="new-badge">+</span>
        </a>
        <a id="new-slide-btn" class="footer-btn" title="New Slide" href="https://slides.new/" target="_blank">
          <img src="https://ssl.gstatic.com/docs/presentations/images/favicon-2023q4.ico" alt="New Slide" />
          <span class="new-badge">+</span>
        </a>
      </div>
      <div id="footer-right">
        <button id="refresh-btn" class="footer-btn" title="Refresh">
          <img src="chrome://global/skin/icons/reload.svg" alt="Refresh" />
        </button>
        <div style="position:relative">
          <div id="settings-popup" style="display:none">
            <div class="popup-view-btns">
              <button id="view-today-btn" class="popup-view-btn active">Today</button>
              <button id="view-tomorrow-btn" class="popup-view-btn">Tomorrow</button>
            </div>
            <div class="popup-divider"></div>
            <label class="popup-toggle-row">
              <span>Notifications</span>
              <input type="checkbox" id="notifications-toggle" checked />
            </label>
            <label class="popup-toggle-row">
              <span>Recent Documents</span>
              <input type="checkbox" id="recent-docs-toggle" checked />
            </label>
          </div>
          <button id="settings-btn" class="footer-btn" title="Settings">
            <img src="chrome://global/skin/icons/settings.svg" alt="Settings" />
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="frontend/sidebar.js"></script>
  </body>
</html>
